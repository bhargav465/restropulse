name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy all services regardless of changed files
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
      publisher: ${{ steps.changes.outputs.publisher }}
      content-engine: ${{ steps.changes.outputs.content-engine }}
      intelligence-worker: ${{ steps.changes.outputs.intelligence-worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  build:
    name: Build
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Build everything in the full monorepo so turbo's cache works correctly
      # across all packages. Splitting the build (e.g. web-only then pruned) causes
      # cache misses inside the pruned dir because the cache keys differ.
      - name: Build all
        run: npx turbo build --filter=!@restropulse/db-cli
        env:
          NODE_ENV: production

      # Zero-secret web bundle: the build above no longer bakes VITE_FIREBASE_*,
      # VITE_GOOGLE_MAPS_API_KEY, VITE_APPINSIGHTS_CONNECTION_STRING, or
      # VITE_RAZORPAY_KEY_ID into the compiled JS. Instead a same-origin
      # config.json sidecar is written into the build output and fetched at
      # runtime by apps/web/utils/client-config.ts. This file only ever
      # contains public web-facing config. AKV-first policy: any secret-backed
      # values in this file must come from Azure Key Vault fetches in this step
      # (never GitHub secrets/vars). Never fetch/emit FIREBASE-SERVICE-ACCOUNT-KEY
      # (server-only admin secret).
      - name: Generate config.json sidecar from Key Vault
        run: |
          get_secret() {
            az keyvault secret show \
              --vault-name restropulse-prod-kv \
              --name "staging-$(echo "$1" | tr '[:upper:]' '[:lower:]')" \
              --query "value" -o tsv
          }

          FIREBASE_API_KEY=$(get_secret FIREBASE-API-KEY)
          echo "::add-mask::$FIREBASE_API_KEY"
          FIREBASE_AUTH_DOMAIN=$(get_secret FIREBASE-AUTH-DOMAIN)
          echo "::add-mask::$FIREBASE_AUTH_DOMAIN"
          FIREBASE_PROJECT_ID=$(get_secret FIREBASE-PROJECT-ID)
          echo "::add-mask::$FIREBASE_PROJECT_ID"
          FIREBASE_STORAGE_BUCKET=$(get_secret FIREBASE-STORAGE-BUCKET)
          echo "::add-mask::$FIREBASE_STORAGE_BUCKET"
          FIREBASE_MESSAGING_SENDER_ID=$(get_secret FIREBASE-MESSAGING-SENDER-ID)
          echo "::add-mask::$FIREBASE_MESSAGING_SENDER_ID"
          FIREBASE_APP_ID=$(get_secret FIREBASE-APP-ID)
          echo "::add-mask::$FIREBASE_APP_ID"
          MAPS_KEY=$(get_secret WEB-GOOGLE-MAPS-API-KEY)
          echo "::add-mask::$MAPS_KEY"
          APPINSIGHTS=$(get_secret WEB-APPINSIGHTS-CONNECTION-STRING)
          echo "::add-mask::$APPINSIGHTS"
          RAZORPAY_KEY_ID=$(get_secret RAZORPAY-KEY-ID)
          echo "::add-mask::$RAZORPAY_KEY_ID"
          DEPLOY_GIT_SHA="${{ github.sha }}"
          DEPLOY_RUN_ID="${{ github.run_id }}"
          DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          jq -n \
            --arg apiUrl "${{ vars.STAGING_API_URL }}/api" \
            --arg appUrl "${{ vars.STAGING_WEB_URL }}" \
            --arg googleMapsApiKey "$MAPS_KEY" \
            --arg razorpayKeyId "$RAZORPAY_KEY_ID" \
            --arg appInsightsConnectionString "$APPINSIGHTS" \
            --argjson telemetrySampleRate 100 \
            --arg deployGitSha "$DEPLOY_GIT_SHA" \
            --arg deployRunId "$DEPLOY_RUN_ID" \
            --arg deployedAt "$DEPLOYED_AT" \
            --arg firebaseApiKey "$FIREBASE_API_KEY" \
            --arg firebaseAuthDomain "$FIREBASE_AUTH_DOMAIN" \
            --arg firebaseProjectId "$FIREBASE_PROJECT_ID" \
            --arg firebaseStorageBucket "$FIREBASE_STORAGE_BUCKET" \
            --arg firebaseMessagingSenderId "$FIREBASE_MESSAGING_SENDER_ID" \
            --arg firebaseAppId "$FIREBASE_APP_ID" \
            '{
              apiUrl: $apiUrl,
              appUrl: $appUrl,
              googleMapsApiKey: $googleMapsApiKey,
              razorpayKeyId: $razorpayKeyId,
              appInsightsConnectionString: $appInsightsConnectionString,
              telemetrySampleRate: $telemetrySampleRate,
              deployment: {
                gitSha: $deployGitSha,
                runId: $deployRunId,
                deployedAt: $deployedAt
              },
              firebase: {
                apiKey: $firebaseApiKey,
                authDomain: $firebaseAuthDomain,
                projectId: $firebaseProjectId,
                storageBucket: $firebaseStorageBucket,
                messagingSenderId: $firebaseMessagingSenderId,
                appId: $firebaseAppId
              }
            }' > apps/web/dist/config.json

      - name: Upload web artifact
        if: inputs.force || needs.detect-changes.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 3

      # `turbo prune` produces a minimal monorepo subtree whose package.json +
      # package-lock.json correctly list only the needed workspaces. Running
      # `npm ci` inside it creates workspace symlinks that resolve @restropulse/*
      # packages at runtime. We then copy the already-built dist/ outputs from
      # the full repo into the pruned tree so the symlinks resolve immediately
      # without re-building. The loop is keyed on what turbo prune included, so
      # adding a new @restropulse/* dep just works.
      - name: Prune for API deployment
        if: >-
          inputs.force ||
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true' ||
          needs.detect-changes.outputs.intelligence-worker == 'true'
        run: >-
          npx turbo prune
          @restropulse/api
          @restropulse/publisher
          @restropulse/content-engine
          @restropulse/intelligence-worker
          --out-dir=pruned

      # Run from repo root with --prefix so npm uses pruned/ as the install
      # target rather than detecting the parent monorepo as the workspace root
      # (which would hoist packages to the top-level node_modules instead).
      - name: Install pruned dependencies
        if: >-
          inputs.force ||
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true' ||
          needs.detect-changes.outputs.intelligence-worker == 'true'
        run: |
          npm ci --prefix pruned --omit=dev --ignore-scripts
          echo "pruned/node_modules package count: $(ls pruned/node_modules | wc -l)"

      - name: Copy dist outputs into pruned tree
        if: >-
          inputs.force ||
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true' ||
          needs.detect-changes.outputs.intelligence-worker == 'true'
        run: |
          for pkg_dir in pruned/packages/*/; do
            pkg_name=$(basename "$pkg_dir")
            if [ -d "packages/$pkg_name/dist" ]; then
              cp -r "packages/$pkg_name/dist/." "$pkg_dir/dist/"
            fi
          done
          for app in api publisher content-engine intelligence-worker; do
            cp -r "apps/$app/dist/." "pruned/apps/$app/dist/"
          done

      # npm workspace packages are symlinks in node_modules/@restropulse/.
      # The zip-mount deploy (WEBSITE_RUN_FROM_PACKAGE=1) needs real directories,
      # not symlinks, so we materialize each workspace package into node_modules.
      - name: Materialize workspace packages into node_modules
        if: >-
          inputs.force ||
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true' ||
          needs.detect-changes.outputs.intelligence-worker == 'true'
        run: |
          mkdir -p pruned/node_modules/@restropulse
          for pkg_dir in pruned/packages/*/; do
            pkg_name=$(basename "$pkg_dir")
            target="pruned/node_modules/@restropulse/$pkg_name"
            rm -rf "$target"
            cp -r "$pkg_dir" "$target"
          done

      - name: Add Linux startup script for API + workers
        if: >-
          inputs.force ||
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true' ||
          needs.detect-changes.outputs.intelligence-worker == 'true'
        run: |
          cat > pruned/startup.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          mkdir -p /home/LogFiles

          # App Service may invoke startup from /home. Force cwd to deployed root.
          ROOT_DIR="/home/site/wwwroot"
          if [ ! -d "$ROOT_DIR" ]; then
            ROOT_DIR="$(cd "$(dirname "$0")" && pwd)"
          fi
          cd "$ROOT_DIR"

          pids=()

          start_process() {
            local name="$1"
            local command="$2"
            echo "[startup] launching ${name}: ${command}"
            bash -c "$command" >>"/home/LogFiles/${name}.log" 2>&1 &
            pids+=("$!")
          }

          shutdown() {
            echo "[startup] received shutdown signal; terminating child processes"
            for pid in "${pids[@]}"; do
              kill -TERM "$pid" 2>/dev/null || true
            done
            wait || true
            exit 143
          }

          trap shutdown SIGTERM SIGINT

          start_process "publisher" "node ./apps/publisher/dist/worker.js"
          start_process "content-engine" "node ./apps/content-engine/dist/worker.js"
          start_process "intelligence-worker" "node ./apps/intelligence-worker/dist/worker.js"
          start_process "api" "node ./apps/api/dist/server.js"

          # Exit if any process dies; App Service will restart the app.
          wait -n "${pids[@]}"
          code=$?
          echo "[startup] child process exited with code ${code}; stopping remaining processes"
          for pid in "${pids[@]}"; do
            kill -TERM "$pid" 2>/dev/null || true
          done
          wait || true
          exit "$code"
          SCRIPT
          chmod +x pruned/startup.sh

      - name: Upload API bundle artifact
        if: >-
          inputs.force ||
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true' ||
          needs.detect-changes.outputs.intelligence-worker == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-bundle
          path: pruned/
          retention-days: 3

  deploy-web-staging:
    name: Deploy Web (Staging)
    needs: [detect-changes, build]
    if: inputs.force || needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist/

      # azure/static-web-apps-deploy does not support OIDC inputs directly.
      # Login with OIDC first, then fetch the SWA deployment token via CLI
      # so no long-lived secret needs to be stored in GitHub.
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: swa_token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ vars.AZURE_SWA_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps (staging environment)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: web-dist/
          deployment_environment: staging

  deploy-api-staging:
    name: Deploy API + Workers (Staging)
    needs: [detect-changes, build]
    if: >-
      inputs.force ||
      needs.detect-changes.outputs.api == 'true' ||
      needs.detect-changes.outputs.publisher == 'true' ||
      needs.detect-changes.outputs.content-engine == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: api-bundle
          path: api-bundle/

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # All settings are slot-sticky so staging and production maintain
      # separate configs (different DBs, secrets, URLs) across slot swaps.
      # WEBSITE_RUN_FROM_PACKAGE=1 mounts the zip as a read-only filesystem,
      # bypassing Oryx entirely. SCM_DO_BUILD_DURING_DEPLOYMENT=false is
      # belt-and-suspenders.
      - name: Configure staging slot for zip-mount deploy
        run: |
          az webapp config appsettings set \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --slot-settings \
              NODE_ENV=staging \
              CORS_ORIGIN="${{ vars.STAGING_WEB_URL }}" \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              WEBSITE_NODE_DEFAULT_VERSION="~22" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: Deploy to Azure App Service (staging slot)
        run: |
          rm -rf api-bundle/node_modules/@restropulse/api \
                 api-bundle/node_modules/@restropulse/publisher \
                 api-bundle/node_modules/@restropulse/content-engine \
                 api-bundle/node_modules/@restropulse/intelligence-worker
          cd api-bundle && zip -r ../api-deploy.zip . && cd ..
          API_BUNDLE_SHA256=$(sha256sum api-deploy.zip | awk '{print $1}')
          DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          az webapp config appsettings set \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --slot-settings \
              APP_GIT_SHA="${{ github.sha }}" \
              APP_DEPLOY_RUN_ID="${{ github.run_id }}" \
              APP_DEPLOYED_AT="$DEPLOYED_AT" \
              APP_ARTIFACT_SHA256="$API_BUNDLE_SHA256"
          az webapp deploy \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --src-path api-deploy.zip \
            --type zip \
            --clean true \
            --async false
          az webapp config set \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --startup-file "bash startup.sh" \
            --always-on true

  smoke-test-api:
    name: Smoke Test API
    needs: deploy-api-staging
    if: needs.deploy-api-staging.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/smoke-test.sh

      - name: Smoke test API
        run: bash scripts/smoke-test.sh api "${{ vars.STAGING_API_URL }}"
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}

  smoke-test-web:
    name: Smoke Test Web
    needs: deploy-web-staging
    if: needs.deploy-web-staging.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/smoke-test.sh

      - name: Smoke test Web
        run: bash scripts/smoke-test.sh web "${{ vars.STAGING_WEB_URL }}"
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}

  integration-smoke-staging:
    name: Integration Smoke (KV Staging)
    needs: [smoke-test-api, smoke-test-web]
    if: >-
      needs.smoke-test-api.result == 'success' &&
      needs.smoke-test-web.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run exhaustive KV-backed staging validation
        env:
          AZURE_KEY_VAULT_URL: https://restropulse-prod-kv.vault.azure.net
        run: npm run validate:kv:staging

  tag-staging:
    name: Tag Staging
    needs: [smoke-test-api, smoke-test-web, integration-smoke-staging]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create staging tag
        run: |
          TAG="staging/$(date -u +'%Y-%m-%d-%H%M%S')"
          git tag "$TAG"
          git push origin "$TAG"
