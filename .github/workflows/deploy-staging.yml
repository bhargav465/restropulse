name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
      publisher: ${{ steps.changes.outputs.publisher }}
      content-engine: ${{ steps.changes.outputs.content-engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  build:
    name: Build
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: Build all
        run: npx turbo build
        env:
          NODE_ENV: production

      - name: Upload web artifact
        if: needs.detect-changes.outputs.web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 3

      - name: Prepare API + WebJobs bundle
        if: >-
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true'
        run: |
          mkdir -p deploy-bundle/api
          cp -r apps/api/dist/* deploy-bundle/api/

          mkdir -p deploy-bundle/App_Data/jobs/continuous/publisher
          cp -r apps/publisher/dist/* deploy-bundle/App_Data/jobs/continuous/publisher/
          cat > deploy-bundle/App_Data/jobs/continuous/publisher/run.sh << 'SCRIPT'
          #!/bin/bash
          cd "$(dirname "$0")"
          node worker.js
          SCRIPT
          chmod +x deploy-bundle/App_Data/jobs/continuous/publisher/run.sh

          mkdir -p deploy-bundle/App_Data/jobs/continuous/content-engine
          cp -r apps/content-engine/dist/* deploy-bundle/App_Data/jobs/continuous/content-engine/
          cat > deploy-bundle/App_Data/jobs/continuous/content-engine/run.sh << 'SCRIPT'
          #!/bin/bash
          cd "$(dirname "$0")"
          node worker.js
          SCRIPT
          chmod +x deploy-bundle/App_Data/jobs/continuous/content-engine/run.sh

          # Copy root package.json for production deps
          cp package.json deploy-bundle/
          cp package-lock.json deploy-bundle/
          cd deploy-bundle && npm ci --omit=dev --ignore-scripts

      - name: Upload API bundle artifact
        if: >-
          needs.detect-changes.outputs.api == 'true' ||
          needs.detect-changes.outputs.publisher == 'true' ||
          needs.detect-changes.outputs.content-engine == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: api-bundle
          path: deploy-bundle/
          retention-days: 3

  deploy-web-staging:
    name: Deploy Web (Staging)
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist/

      - name: Deploy to Azure Static Web Apps (staging environment)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: web-dist/
          deployment_environment: staging

  deploy-api-staging:
    name: Deploy API + Workers (Staging)
    needs: [detect-changes, build]
    if: >-
      needs.detect-changes.outputs.api == 'true' ||
      needs.detect-changes.outputs.publisher == 'true' ||
      needs.detect-changes.outputs.content-engine == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: api-bundle
          path: api-bundle/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service (staging slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
          slot-name: staging
          package: api-bundle/
          startup-command: node api/server.js

  smoke-tests:
    name: Smoke Tests
    needs: [detect-changes, deploy-web-staging, deploy-api-staging]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke-test.sh

      - name: Smoke test API
        if: needs.deploy-api-staging.result == 'success'
        run: bash scripts/smoke-test.sh api "${{ vars.STAGING_API_URL }}"

      - name: Smoke test Web
        if: needs.deploy-web-staging.result == 'success'
        run: bash scripts/smoke-test.sh web "${{ vars.STAGING_WEB_URL }}"

  tag-staging:
    name: Tag Staging
    needs: smoke-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create staging tag
        run: |
          TAG="staging/$(date -u +'%Y-%m-%d-%H%M%S')"
          git tag "$TAG"
          git push origin "$TAG"

  ratchet-coverage:
    name: Ratchet Coverage Baseline
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: Run all coverage
        run: npx turbo test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Ratchet baseline
        run: node scripts/ratchet-coverage.mjs

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/coverage-baseline.json
          git diff --cached --quiet && echo "No coverage changes" && exit 0
          git commit -m "chore(ci): ratchet coverage baseline"
          git push
