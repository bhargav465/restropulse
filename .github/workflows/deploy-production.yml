name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to promote (staging tag or commit SHA)
        required: true
        type: string
      services:
        description: Services to deploy (comma-separated or "all")
        required: false
        default: all
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Web
    if: contains(inputs.services, 'web') || inputs.services == 'all'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build web
        run: npx turbo build --filter=@restropulse/web
        env:
          NODE_ENV: production

      # Zero-secret web bundle: the build above no longer bakes VITE_FIREBASE_*,
      # VITE_GOOGLE_MAPS_API_KEY, VITE_APPINSIGHTS_CONNECTION_STRING, or
      # VITE_RAZORPAY_KEY_ID into the compiled JS. Instead a same-origin
      # config.json sidecar is written into the build output and fetched at
      # runtime by apps/web/utils/client-config.ts. This file only ever
      # contains public web-facing config -- never fetch/emit
      # FIREBASE-SERVICE-ACCOUNT-KEY (server-only admin secret).
      - name: Generate config.json sidecar from Key Vault
        run: |
          get_secret() {
            az keyvault secret show \
              --vault-name restropulse-prod-kv \
              --name "PROD-$1" \
              --query "value" -o tsv
          }

          FIREBASE_API_KEY=$(get_secret FIREBASE-API-KEY)
          echo "::add-mask::$FIREBASE_API_KEY"
          FIREBASE_AUTH_DOMAIN=$(get_secret FIREBASE-AUTH-DOMAIN)
          echo "::add-mask::$FIREBASE_AUTH_DOMAIN"
          FIREBASE_PROJECT_ID=$(get_secret FIREBASE-PROJECT-ID)
          echo "::add-mask::$FIREBASE_PROJECT_ID"
          FIREBASE_STORAGE_BUCKET=$(get_secret FIREBASE-STORAGE-BUCKET)
          echo "::add-mask::$FIREBASE_STORAGE_BUCKET"
          FIREBASE_MESSAGING_SENDER_ID=$(get_secret FIREBASE-MESSAGING-SENDER-ID)
          echo "::add-mask::$FIREBASE_MESSAGING_SENDER_ID"
          FIREBASE_APP_ID=$(get_secret FIREBASE-APP-ID)
          echo "::add-mask::$FIREBASE_APP_ID"
          MAPS_KEY=$(get_secret WEB-GOOGLE-MAPS-API-KEY)
          echo "::add-mask::$MAPS_KEY"
          APPINSIGHTS=$(get_secret WEB-APPINSIGHTS-CONNECTION-STRING)
          echo "::add-mask::$APPINSIGHTS"
          RAZORPAY_KEY_ID=$(get_secret RAZORPAY-KEY-ID)
          echo "::add-mask::$RAZORPAY_KEY_ID"

          jq -n \
            --arg apiUrl "${{ vars.PRODUCTION_API_URL }}/api" \
            --arg appUrl "${{ vars.PRODUCTION_WEB_URL }}" \
            --arg googleMapsApiKey "$MAPS_KEY" \
            --arg razorpayKeyId "$RAZORPAY_KEY_ID" \
            --arg appInsightsConnectionString "$APPINSIGHTS" \
            --argjson telemetrySampleRate 100 \
            --arg firebaseApiKey "$FIREBASE_API_KEY" \
            --arg firebaseAuthDomain "$FIREBASE_AUTH_DOMAIN" \
            --arg firebaseProjectId "$FIREBASE_PROJECT_ID" \
            --arg firebaseStorageBucket "$FIREBASE_STORAGE_BUCKET" \
            --arg firebaseMessagingSenderId "$FIREBASE_MESSAGING_SENDER_ID" \
            --arg firebaseAppId "$FIREBASE_APP_ID" \
            '{
              apiUrl: $apiUrl,
              appUrl: $appUrl,
              googleMapsApiKey: $googleMapsApiKey,
              razorpayKeyId: $razorpayKeyId,
              appInsightsConnectionString: $appInsightsConnectionString,
              telemetrySampleRate: $telemetrySampleRate,
              firebase: {
                apiKey: $firebaseApiKey,
                authDomain: $firebaseAuthDomain,
                projectId: $firebaseProjectId,
                storageBucket: $firebaseStorageBucket,
                messagingSenderId: $firebaseMessagingSenderId,
                appId: $firebaseAppId
              }
            }' > apps/web/dist/config.json

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 3

  deploy-web-production:
    name: Deploy Web (Production)
    needs: build-web
    if: contains(inputs.services, 'web') || inputs.services == 'all'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist/

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: swa_token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ vars.AZURE_SWA_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps (production)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: web-dist/

  swap-api-production:
    name: Swap API + Workers to Production
    # Wait for web to deploy first so both services update together. If web
    # was not in this deployment (deploy-web-production skipped), always() lets
    # this job proceed anyway; !failure() blocks the swap if web deploy failed.
    needs: [deploy-web-production]
    if: >-
      always() &&
      !failure() &&
      !cancelled() &&
      (contains(inputs.services, 'api') ||
       contains(inputs.services, 'publisher') ||
       contains(inputs.services, 'content-engine') ||
       inputs.services == 'all')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # All settings are slot-sticky so production keeps its own config
      # (NODE_ENV, DB, secrets) across slot swaps. WEBSITE_RUN_FROM_PACKAGE=1
      # mounts the zip as a read-only filesystem, bypassing Oryx entirely.
      - name: Configure production for zip-mount deploy
        run: |
          az webapp config appsettings set \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot-settings \
              NODE_ENV=production \
              CORS_ORIGIN="${{ vars.PRODUCTION_WEB_URL }}" \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              WEBSITE_NODE_DEFAULT_VERSION="~22" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: Swap staging slot to production
        run: |
          az webapp deployment slot swap \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production

  smoke-test-api:
    name: Smoke Test API
    needs: swap-api-production
    if: needs.swap-api-production.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/smoke-test.sh

      - name: Smoke test API
        run: bash scripts/smoke-test.sh api "${{ vars.PRODUCTION_API_URL }}"

  smoke-test-web:
    name: Smoke Test Web
    needs: deploy-web-production
    if: needs.deploy-web-production.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/smoke-test.sh

      - name: Smoke test Web
        run: bash scripts/smoke-test.sh web "${{ vars.PRODUCTION_WEB_URL }}"

  tag-production:
    name: Tag Production
    needs: [smoke-test-api, smoke-test-web]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Create production tag
        run: |
          TAG="production/$(date -u +'%Y-%m-%d-%H%M%S')"
          git tag "$TAG"
          git push origin "$TAG"
