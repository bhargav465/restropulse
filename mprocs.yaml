# Cross-platform: `shell` runs each command through the platform shell
# (cmd /C on Windows, $SHELL on macOS/Linux). Do not use `cmd: ["cmd", "/c", ...]`
# here -- that hardcodes the Windows shell and breaks `npm run dev` on macOS/Linux.
procs:
  env-editor:
    shell: "node scripts/env-editor.mjs"
    cwd: .

  web:
    shell: "npm run dev"
    cwd: apps/web

  api:
    shell: "npm run dev"
    cwd: apps/api

  publisher:
    shell: "npm run dev"
    cwd: apps/publisher

  content-engine:
    shell: "npm run dev"
    cwd: apps/content-engine

  intelligence-worker:
    shell: "npm run dev"
    cwd: apps/intelligence-worker

  webhook-tunnel:
    shell: "node scripts/start-ngrok.mjs"
    cwd: .

  asset-tunnel:
    shell: "node scripts/start-asset-tunnel.mjs"
    cwd: .
