syntax = "proto3";

package restropulse;

// ===== ENUMS =====

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  PAUSED = 2;
  PAST_DUE = 3;
}

enum ConversationState {
  CONVERSATION_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  ONBOARDING = 2;
  AWAITING_STRATEGY_REVIEW = 3;
  PROVIDING_STRATEGY_FEEDBACK = 4;
  AWAITING_POST_REVIEW = 5;
  PROVIDING_POST_FEEDBACK = 6;
  MENU_SELECTION = 7;
  SUPPORT_QUERY = 8;
  FLOW_IN_PROGRESS = 9;
}

enum StrategyStatus {
  STRATEGY_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  PENDING_APPROVAL = 2;
  APPROVED = 3;
  CHANGES_REQUESTED = 4;
}

enum PostStatus {
  POST_STATUS_UNSPECIFIED = 0;
  POST_DRAFT = 1;
  POST_PENDING_APPROVAL = 2;
  POST_CHANGES_REQUESTED = 3;
  POST_APPROVED = 4;
  SCHEDULED = 5;
  POSTED = 6;
  FAILED = 7;
}

enum MessageDirection {
  MESSAGE_DIRECTION_UNSPECIFIED = 0;
  INBOUND = 1;
  OUTBOUND = 2;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  TEXT = 1;
  IMAGE = 2;
  VIDEO = 3;
  DOCUMENT = 4;
  INTERACTIVE = 5;
  FLOW_RESPONSE = 6;
}

enum InteractiveType {
  INTERACTIVE_TYPE_UNSPECIFIED = 0;
  LIST_REPLY = 1;
  BUTTON_REPLY = 2;
  NFM_REPLY = 3;
}

enum ButtonAction {
  BUTTON_ACTION_UNSPECIFIED = 0;
  VIEW_PROFILE = 1;
  CHECK_STRATEGY = 2;
  VIEW_NEXT_POST = 3;
  CONTACT_MANAGER = 4;
  STRATEGY_APPROVE = 5;
  STRATEGY_FEEDBACK = 6;
  POST_APPROVE = 7;
  POST_FEEDBACK = 8;
  BACK_TO_MENU = 9;
}

enum StrategyFeedbackTag {
  STRATEGY_FEEDBACK_TAG_UNSPECIFIED = 0;
  FREQUENCY = 1;
  TIMING = 2;
  TOPICS = 3;
  VARIETY = 4;
  OTHER = 5;
}

enum PostFeedbackTag {
  POST_FEEDBACK_TAG_UNSPECIFIED = 0;
  MEDIA = 1;
  CAPTION = 2;
  HASHTAGS = 3;
  POST_TIMING = 4;
  POST_OTHER = 5;
}

enum MessageContext {
  MESSAGE_CONTEXT_UNSPECIFIED = 0;
  // User -> Bot
  USER_SPONTANEOUS = 1;
  USER_MENU_REQUEST = 2;
  USER_PROFILE_VIEW = 3;
  USER_STRATEGY_VIEW = 4;
  USER_POST_VIEW = 5;
  USER_CONTACT_MANAGER = 6;
  USER_BACK_TO_MENU = 7;
  USER_STRATEGY_APPROVE = 8;
  USER_STRATEGY_FEEDBACK_START = 9;
  USER_STRATEGY_FEEDBACK_SUBMIT = 10;
  USER_POST_APPROVE = 11;
  USER_POST_FEEDBACK_START = 12;
  USER_POST_FEEDBACK_SUBMIT = 13;
  // Bot -> User
  BOT_MENU = 20;
  BOT_PROFILE = 21;
  BOT_STRATEGY_DISPLAY = 22;
  BOT_POST_DISPLAY = 23;
  BOT_SUPPORT_CONFIRMATION = 24;
  BOT_STRATEGY_APPROVED = 25;
  BOT_POST_APPROVED = 26;
  BOT_FEEDBACK_RECEIVED = 27;
}

enum MessageResolutionStatus {
  MESSAGE_RESOLUTION_STATUS_UNSPECIFIED = 0;
  AUTO_RESOLVED = 1;
  PENDING_HUMAN = 2;
  RESOLVED_BY_HUMAN = 3;
  ESCALATED = 4;
}

// ===== MESSAGES =====

// Standalone collection for account managers
message AccountManager {
  string id = 1;
  string name = 2;
  string email = 3;
  string contact_number = 4;
  repeated string restaurant_ids = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

// Standalone collection for subscription plans
message SubscriptionPlan {
  string id = 1;
  string name = 2;
  string description = 3;
  double monthly_price = 4;
  double annual_price = 5;
  int32 posts_per_month = 6;
  int32 strategy_reviews_per_month = 7;
  bool priority_support = 8;
  bool custom_content = 9;
  bool analytics_dashboard = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

// Standalone collection for restaurant subscriptions
message Subscription {
  string id = 1;
  string restaurant_id = 2;
  string plan_id = 3;
  SubscriptionStatus status = 4;
  int64 start_date = 5;
  int64 next_billing_date = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message Restaurant {
  string id = 1;
  string whatsapp_id = 2;
  string business_name = 3;
  string cuisine_type = 4;
  string contact_number = 5;
  string instagram_link = 6;
  string account_manager_id = 7;
  string subscription_id = 8;
  ConversationState conversation_state = 9;
  int64 last_interaction_at = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message PostBreakdown {
  int32 menu_highlights = 1;
  int32 customer_reviews = 2;
  int32 chef_specials = 3;
  int32 restaurant_ambiance = 4;
  int32 behind_the_scenes = 5;
  int32 seasonal_events = 6;
  int32 trending_discussions = 7;
  int32 miscellaneous = 8;
}

message CalendarEntry {
  string post_type = 1;
  int32 day_of_month = 2;
  string day_of_week = 3;
  string preferred_time = 4;
  string rationale = 5;
}

message ContentCalendar {
  repeated CalendarEntry scheduled_posts = 1;
  int32 posts_per_week = 2;
  int32 posts_on_weekdays = 3;
  int32 posts_on_weekends = 4;
  map<string, int32> post_type_distribution = 5;
}

message ContentStrategy {
  string id = 1;
  string restaurant_id = 2;
  int64 cycle_start_date = 3;
  int64 cycle_end_date = 4;
  string summary_text = 5;
  PostBreakdown post_breakdown = 6;
  ContentCalendar content_calendar = 7;
  int32 total_posts = 8;
  StrategyStatus status = 9;
  int64 approved_at = 10;
  string feedback_text = 11;
  repeated string feedback_tags = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
}

message Post {
  string id = 1;
  string restaurant_id = 2;
  string strategy_id = 3;
  string caption = 4;
  repeated string hashtags = 5;
  string media_url = 6;
  string media_type = 7;
  int64 scheduled_date = 8;
  PostStatus status = 9;
  int64 approved_at = 10;
  string feedback_text = 11;
  repeated string feedback_tags = 12;
  int64 posted_at = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

message InteractiveData {
  InteractiveType type = 1;
  string button_id = 2;
  string list_id = 3;
  string title = 4;
  string description = 5;
}

message FlowResponseData {
  string flow_token = 1;
  map<string, string> response_json = 2;
}

message MessageLog {
  string id = 1;
  string restaurant_whatsapp_id = 2;
  MessageDirection direction = 3;
  MessageType message_type = 4;
  string body = 5;
  string media_url = 6;
  InteractiveData interactive_data = 7;
  FlowResponseData flow_response_data = 8;
  MessageContext context = 9;
  bool bot_response_sent = 10;
  string processing_error = 11;
  bool requires_human_attention = 12;
  MessageResolutionStatus resolution_status = 13;
  int64 resolved_at = 14;
  string resolved_by = 15;
  int64 timestamp = 16;
  int64 created_at = 17;
}

message SupportRequest {
  string id = 1;
  string restaurant_id = 2;
  string restaurant_whatsapp_id = 3;
  string request_type = 4;
  string description = 5;
  string status = 6;
  int64 created_at = 7;
  int64 resolved_at = 8;
}

message WhatsAppFlow {
  string id = 1;
  string name = 2;
  string flow_id = 3;
  string flow_token = 4;
  string screen_id = 5;
  string purpose = 6;
  int64 created_at = 7;
}
